name: Build Intel DMG
on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ['v*']
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run protocol and supervisor tests
        run: python3 Tests/test_transport.py
      - name: Build x86_64 app and DMG
        run: bash scripts/build.command
      - uses: actions/upload-artifact@v4
        with:
          name: Harbour-Intel
          path: dist/Harbour-Intel.dmg
